name: micro-service

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - micro-service-net
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  gateway:
    <<: *service-defaults
    container_name: c-gateway
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      CUSTOMERS_URL: http://customers:8000
      SHOPPING_URL: http://shopping:8001
      PRODUCTS_URL: http://products:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      customers:
        condition: service_healthy
      products:
        condition: service_healthy
      shopping:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  customers:
    <<: *service-defaults
    container_name: c-customers
    build: ./customers
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      DB_URL: mongodb://customers-db:27017/customers
      APP_SECRET: dev-secret-change-me
    depends_on:
      customers-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  customers-db:
    <<: *service-defaults
    container_name: c-customers-db
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - customers-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  shopping:
    <<: *service-defaults
    container_name: c-shopping
    build: ./shopping
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DB_URL: mongodb://shopping-db:27017/shopping
      APP_SECRET: dev-secret-change-me
    depends_on:
      shopping-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  shopping-db:
    <<: *service-defaults
    container_name: c-shopping-db
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - shopping-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  products:
    <<: *service-defaults
    container_name: c-products
    build: ./products
    ports:
      - "8002:8002"
    environment:
      PORT: 8002
      DB_URL: mongodb://products-db:27017/products
      APP_SECRET: dev-secret-change-me
    depends_on:
      products-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  products-db:
    <<: *service-defaults
    container_name: c-products-db
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - products-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  customers-data:
  shopping-data:
  products-data:

networks:
  micro-service-net:
    driver: bridge
    name: micro-service-net
