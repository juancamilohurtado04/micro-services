services:
  shopping:
    container_name: c-shopping
    build: .
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      DB_URL: mongodb://shopping-db:27017/shopping
      APP_SECRET: dev-secret-change-me
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - shopping-db

  shopping-db:
    container_name: c-shopping-db
    image: mongo:7
    ports:
      - "27019:27017"
    volumes:
      - shopping-data:/data/db

volumes:
  shopping-data:
